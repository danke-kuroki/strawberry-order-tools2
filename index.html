<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>いちご ご予約フォーム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* =========================================================
   色の設定（ライト / ダーク）
   ========================================================= */
:root{
  --bg:#FFF7F5; --paper:#FFFFFF; --ink:#24382B; --sub:#5E6F63; --line:#EBDAD6;
  --berry:#D42A45; --berry-d:#A81C33; --berry-soft:#FCE3E6;
  --leaf:#2F6B3F; --leaf-soft:#E3F0E5; --muted:#F4EDEB; --dis:#C3B7B4;
  --seed:#FFD98A;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1B1716; --paper:#26201F; --ink:#F2ECEA; --sub:#B9AEAA; --line:#403634;
    --berry:#EE5069; --berry-d:#FF8A9C; --berry-soft:#45242A;
    --leaf:#7CC48D; --leaf-soft:#1F3325; --muted:#2F2826; --dis:#5E5350;
    --seed:#F5CB6E; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1B1716; --paper:#26201F; --ink:#F2ECEA; --sub:#B9AEAA; --line:#403634;
  --berry:#EE5069; --berry-d:#FF8A9C; --berry-soft:#45242A;
  --leaf:#7CC48D; --leaf-soft:#1F3325; --muted:#2F2826; --dis:#5E5350;
  --seed:#F5CB6E; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
  font-weight:500; font-size:16px; line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--leaf);outline-offset:2px}

/* ---------- ヘッダー：いちごの表皮 ---------- */
.hero{
  background-color:#D42A45;
  background-image:
    radial-gradient(ellipse 3px 4.5px at 20px 18px,var(--seed) 98%,transparent),
    radial-gradient(ellipse 3px 4.5px at 52px 42px,var(--seed) 98%,transparent);
  background-size:64px 56px;
  color:#fff; text-align:center;
  padding:28px 20px 34px; position:relative;
}
.hero::after{
  content:""; position:absolute; left:0; right:0; bottom:-1px; height:14px;
  background:radial-gradient(circle at 10px -2px,transparent 11px,var(--bg) 12px) 0 0/20px 14px repeat-x;
}
.hero h1{
  margin:0; font-weight:900; font-size:clamp(28px,6vw,44px); letter-spacing:.06em; line-height:1.25;
  text-shadow:0 2px 0 #A81C33;
}
.hero p{margin:6px 0 0;font-size:14px;opacity:.95}

/* ---------- ステップ ---------- */
.steps{display:flex;justify-content:center;gap:0;margin:26px auto 8px;max-width:440px;padding:0 20px;list-style:none}
.steps li{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;font-size:13px;color:var(--sub)}
.steps li::before{
  content:""; position:absolute; top:17px; left:-50%; width:100%; height:2px; background:var(--line); z-index:0;
}
.steps li:first-child::before{display:none}
.steps .dot{
  width:36px;height:36px;border-radius:50%;display:grid;place-items:center;
  background:var(--muted);color:var(--sub);font-weight:900;position:relative;z-index:1;margin-bottom:4px;
}
.steps li.done .dot{background:var(--leaf);color:var(--paper)}
.steps li.done::before,.steps li.now::before{background:var(--leaf)}
.steps li.now .dot{background:var(--berry);color:#fff;box-shadow:0 0 0 5px var(--berry-soft)}
.steps li.now{color:var(--ink);font-weight:700}

/* ---------- レイアウト ---------- */
.wrap{max-width:1080px;margin:0 auto;padding:12px 16px 120px;display:grid;gap:24px}
@media (min-width:900px){
  .wrap{grid-template-columns:minmax(0,1fr) 330px;align-items:start;padding-bottom:60px}
}
h2{font-size:24px;font-weight:900;margin:12px 0 4px;letter-spacing:.04em}
.lead{margin:0 0 18px;color:var(--sub);font-size:14px}

/* ---------- 商品 ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.item{
  background:var(--paper);border:2px solid var(--line);border-radius:18px;
  padding:14px 14px 16px;display:flex;flex-direction:column;transition:border-color .15s;
}
.item.on{border-color:var(--berry);background:linear-gradient(var(--paper),var(--paper)) padding-box}
.item .pic{
  aspect-ratio:4/3;overflow:hidden;border-radius:12px;background:var(--berry-soft);display:grid;place-items:center;margin-bottom:12px;position:relative;
}
.item.white .pic{background:var(--leaf-soft)}
.item .pic svg{width:84px;height:84px}
.item .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.item .tag{z-index:1}
.points{list-style:none;margin:6px 0 12px;padding:0;flex:1;font-size:13px;color:var(--sub);line-height:1.6}
.points li{position:relative;padding-left:14px;margin-bottom:3px}
.points li::before{content:"";position:absolute;left:2px;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--berry)}
.noship{align-self:flex-start;margin-top:4px;font-size:12px;font-weight:700;color:var(--berry-d);background:var(--berry-soft);padding:1px 10px;border-radius:999px}
.item .tag{
  position:absolute;left:8px;top:8px;background:var(--paper);color:var(--ink);
  font-size:12px;padding:2px 10px;border-radius:999px;font-weight:700
}
.item h3{margin:0;font-size:19px;font-weight:900;line-height:1.4}
.item .desc{margin:2px 0 8px;font-size:13px;color:var(--sub);line-height:1.6;flex:1}
.item .price{font-weight:900;color:var(--berry);font-size:19px;margin-bottom:10px}
.item .price small{font-size:12px;color:var(--sub);font-weight:500;margin-left:2px}
.stepper{display:flex;align-items:center;justify-content:space-between;background:var(--muted);border-radius:999px;padding:4px}
.stepper button{
  width:40px;height:40px;border-radius:50%;border:0;cursor:pointer;font-size:22px;font-weight:700;line-height:1;
  background:var(--berry);color:#fff;
}
.stepper button.minus{background:var(--paper);color:var(--berry);border:2px solid var(--berry-soft)}
.stepper button:disabled{background:var(--muted);color:var(--dis);border-color:transparent;cursor:default}
.stepper output{font-size:20px;font-weight:900;min-width:2em;text-align:center}
.soldout .stepper{opacity:.5}

/* ---------- カレンダー ---------- */
.panel{background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:18px}
.panel + .panel{margin-top:16px}
.panel h3{margin:0 0 12px;font-size:17px;font-weight:900}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.calhead strong{font-size:18px}
.calhead button{
  border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 14px;cursor:pointer;font-size:14px;font-weight:700
}
.calhead button:disabled{opacity:.35;cursor:default}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal .wd{font-size:12px;color:var(--sub);font-weight:700;padding-bottom:2px}
.cal .wd.sun{color:var(--berry)} .cal .wd.sat{color:#3B74C4}
.cal button{
  aspect-ratio:1/1;max-height:56px;width:100%;border-radius:12px;border:2px solid var(--line);
  background:var(--paper);cursor:pointer;font-weight:700;font-size:15px;padding:0
}
.cal button:disabled{background:var(--muted);color:var(--dis);border-color:transparent;cursor:default}
.cal button.sel{background:var(--berry);border-color:var(--berry);color:#fff}
.legend{display:flex;gap:14px;margin-top:10px;font-size:12px;color:var(--sub);flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:-1px}
.legend .a::before{border:2px solid var(--line);background:var(--paper)}
.legend .b::before{background:var(--muted)}
.legend .c::before{background:var(--berry)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.slots button{
  border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:12px 8px;cursor:pointer;font-weight:700
}
.slots button.sel{background:var(--leaf);border-color:var(--leaf);color:var(--paper)}
.hint{font-size:13px;color:var(--sub);margin:0}

/* ---------- フォーム ---------- */
.field{margin-bottom:16px}
.field label{display:block;font-weight:700;font-size:14px;margin-bottom:4px}
.field label .req{color:var(--berry);margin-left:4px;font-size:12px}
.field label .opt{color:var(--sub);margin-left:4px;font-size:12px;font-weight:500}
.field input,.field textarea{
  width:100%;border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:11px 13px;font-size:16px
}
.field textarea{min-height:84px;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--leaf);outline:none}
.field .err{color:var(--berry);font-size:13px;margin-top:3px;display:none}
.field.bad .err{display:block}
.field.bad input{border-color:var(--berry)}
.notice{background:var(--leaf-soft);border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:12px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer;margin-bottom:18px}
.check input{width:22px;height:22px;accent-color:var(--berry);flex:none;margin-top:1px}

/* ---------- サマリー ---------- */
.summary{background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:18px}
@media (min-width:900px){.summary{position:sticky;top:calc(16px + env(safe-area-inset-top,0px))}}
.summary h3{margin:0 0 10px;font-size:17px;font-weight:900}
.when{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{font-size:13px;padding:3px 11px;border-radius:999px;background:var(--muted);color:var(--sub);font-weight:700}
.chip.ok{background:var(--leaf-soft);color:var(--leaf)}
.lines{list-style:none;margin:0;padding:0}
.lines li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
.lines .empty{color:var(--sub);justify-content:center}
.total{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px}
.total b{font-size:26px;color:var(--berry);font-weight:900}
.pay{font-size:12px;color:var(--sub);margin:8px 0 0;text-align:center}

.btn{
  display:block;width:100%;border:0;border-radius:999px;padding:15px 18px;font-weight:900;font-size:17px;cursor:pointer;
  background:var(--berry);color:#fff;box-shadow:0 4px 0 var(--berry-d);text-align:center;text-decoration:none;
  margin-top:14px;
}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--berry-d)}
.btn:disabled{background:var(--muted);color:var(--dis);box-shadow:none;cursor:default}
.btn.line{background:#06C755;box-shadow:0 4px 0 #04913E}
.btn.ghost{background:var(--paper);color:var(--ink);border:2px solid var(--line);box-shadow:none;font-weight:700}
.back{background:none;border:0;color:var(--sub);cursor:pointer;padding:8px 0;font-weight:700;margin-top:6px}
.side-only{display:none}
@media (min-width:900px){.side-only{display:block}}

/* ---------- スマホ用の下部バー ---------- */
.bar{
  position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);border-top:2px solid var(--line);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:center
}
.bar .info{flex:1;font-size:13px;color:var(--sub);line-height:1.3}
.bar .info b{display:block;font-size:20px;color:var(--berry);font-weight:900}
.bar .btn{width:auto;margin:0;padding:12px 20px;font-size:16px}
@media (min-width:900px){.bar{display:none}}

/* ---------- 確認モーダル ---------- */
.modal{position:fixed;inset:0;z-index:40;background:rgba(20,10,10,.5);display:none;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
@media (min-width:600px){.modal{align-items:center}}
.sheet{
  background:var(--paper);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom,0px));
  max-height:92vh;overflow:auto;animation:up .22s ease-out
}
@media (min-width:600px){.sheet{border-radius:22px}}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet h2{margin:0 0 4px}
.dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;background:var(--muted);border-radius:14px;padding:14px;font-size:14px;margin-top:14px}
.dl dt{color:var(--sub)} .dl dd{margin:0;word-break:break-all}
.row{display:flex;gap:10px} .row .btn{margin-top:16px}

/* ---------- 完了 ---------- */
.done-card{max-width:560px;margin:0 auto;text-align:center}
.num{font-size:44px;font-weight:900;letter-spacing:.12em;color:var(--berry);margin:4px 0}
.must{background:var(--berry-soft);border-radius:14px;padding:14px;font-size:15px;margin:16px 0 4px;text-align:left}
pre.txt{white-space:pre-wrap;text-align:left;background:var(--muted);border-radius:14px;padding:14px;font:inherit;font-size:14px;margin:14px 0 0}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
[hidden]{display:none!important}
</style>
</head>
<body>

<header class="hero">
  <h1 id="farmName">暖家のいちご</h1>
  <p id="farmTag">ご予約フォーム</p>
</header>

<ol class="steps" id="steps" aria-label="予約の手順">
  <li data-s="1"><span class="dot">1</span>商品</li>
  <li data-s="2"><span class="dot">2</span>受取日時</li>
  <li data-s="3"><span class="dot">3</span>お客様情報</li>
</ol>

<main class="wrap" id="main">
  <section id="view"></section>
  <aside class="summary side-only" id="summary" aria-live="polite"></aside>
</main>

<div class="bar" id="bar">
  <div class="info"><span id="barCount">0点</span><b id="barTotal">¥0</b></div>
  <button class="btn" id="barNext">次へ</button>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="sheet" id="sheet"></div>
</div>

<div class="toast" id="toast"></div>

const jpDate = d => `${d.getMonth()+1}/${d.getDate()}（${WD[d.getDay()]}）`;

document.title = CONFIG.farmName + " ご予約フォーム";
$("#farmName").textContent = CONFIG.farmName;
$("#farmTag").textContent = CONFIG.tagline;

const today = new Date(); today.setHours(0,0,0,0);
const firstDay = new Date(today); firstDay.setDate(firstDay.getDate() + CONFIG.leadDays);
const lastDay  = new Date(today); lastDay.setDate(lastDay.getDate() + CONFIG.maxDays);

const S = {
  step:1, qty:{}, date:null, slot:null,
  name:"", phone:"", email:"", note:"", agree:false,
  month:new Date(firstDay.getFullYear(), firstDay.getMonth(), 1),
  orderNo:null, tried:false
};
CONFIG.products.forEach(p => S.qty[p.id] = 0);

const items = () => CONFIG.products.filter(p => S.qty[p.id] > 0);
const count = () => items().reduce((a,p) => a + S.qty[p.id], 0);
const total = () => items().reduce((a,p) => a + S.qty[p.id]*p.price, 0);
const isOpen = d => d >= firstDay && d <= lastDay &&
  !CONFIG.closedWeekdays.includes(d.getDay()) && !CONFIG.closedDates.includes(ymd(d));

/* ---------- いちごのイラスト ---------- */
function berry(white){
  const body = white ? "#FFF1EC" : "#E2364F";
  const edge = white ? "#F2C9C2" : "#B81F38";
  const seed = white ? "#E58A97" : "#FFD98A";
  const seeds = [[40,46],[54,44],[33,58],[47,58],[61,57],[40,70],[54,70],[47,81]]
    .map(([x,y]) => `<ellipse cx="${x}" cy="${y}" rx="1.6" ry="2.4" fill="${seed}"/>`).join("");
  return `<svg viewBox="0 0 94 100" aria-hidden="true">
    <path d="M47 92C30 82 18 64 20 48c2-12 13-17 27-17s25 5 27 17c2 16-10 34-27 44z" fill="${body}" stroke="${edge}" stroke-width="2"/>
    ${seeds}
    <path d="M47 33c-6-9-17-8-21-4 7 0 12 3 15 7-8-1-14 3-15 8 6-3 13-4 21-3 8-1 15 0 21 3-1-5-7-9-15-8 3-4 8-7 15-7-4-4-15-5-21 4z" fill="#3F8A4F"/>
    <path d="M47 33V20" stroke="#3F8A4F" stroke-width="3" stroke-linecap="round"/>
  </svg>`;
}

/* ---------- 画面の描画 ---------- */
function render(){
  document.querySelectorAll("#steps li").forEach(li => {
    const n = +li.dataset.s;
    li.className = S.step === 4 || n < S.step ? "done" : n === S.step ? "now" : "";
    li.querySelector(".dot").textContent = (S.step === 4 || n < S.step) ? "✓" : n;
    if (n === S.step) li.setAttribute("aria-current","step"); else li.removeAttribute("aria-current");
  });
  const v = $("#view");
  if (S.step === 1) v.innerHTML = viewProducts();
  if (S.step === 2) v.innerHTML = viewDate();
  if (S.step === 3) v.innerHTML = viewInfo();
  if (S.step === 4) v.innerHTML = viewDone();
  $("#main").style.gridTemplateColumns = S.step === 4 ? "1fr" : "";
  $("#summary").hidden = S.step === 4;
  $("#bar").hidden = S.step === 4;
  renderSummary();
  bind();
}

function viewProducts(){
  return `<h2>商品を選ぶ</h2>
  <p class="lead">ほしい商品の数を選んでください。複数の商品を組み合わせられます。</p>
  <div class="grid">${CONFIG.products.map(p => {
    const q = S.qty[p.id];
    return `<article class="item ${q?"on":""} ${p.white?"white":""} ${p.soldOut?"soldout":""}">
      <div class="pic">${IMAGES[p.id] ? `<img src="${IMAGES[p.id]}" alt="${esc(p.name)}の写真" loading="lazy">` : berry(p.white)}<span class="tag">${esc(p.tag||"")}</span></div>
      <h3>${esc(p.name)}</h3>
      ${p.noShip ? `<span class="noship">発送不可・店頭受取のみ</span>` : ""}
      ${p.soldOut ? `<p class="desc">本日は完売しました</p>`
        : `<ul class="points">${(p.points||[]).map(t => `<li>${esc(t)}</li>`).join("")}</ul>`}
      <div class="price">${yen(p.price)}<small>／${esc(p.unit)}</small></div>
      <div class="stepper">
        <button class="minus" data-dec="${p.id}" ${q===0||p.soldOut?"disabled":""} aria-label="${esc(p.name)}を1つ減らす">−</button>
        <output aria-live="polite">${q}</output>
        <button data-inc="${p.id}" ${q>=CONFIG.maxPerItem||p.soldOut?"disabled":""} aria-label="${esc(p.name)}を1つ増やす">＋</button>
      </div>
    </article>`;}).join("")}
  </div>`;
}

function viewDate(){
  const m = S.month, y = m.getFullYear(), mo = m.getMonth();
  const start = new Date(y, mo, 1), days = new Date(y, mo+1, 0).getDate();
  const canPrev = new Date(y, mo, 0) >= new Date(firstDay.getFullYear(), firstDay.getMonth(), 1);
  const canNext = new Date(y, mo+1, 1) <= lastDay;
  let cells = WD.map((w,i) => `<div class="wd ${i===0?"sun":i===6?"sat":""}">${w}</div>`).join("");
  for (let i=0;i<start.getDay();i++) cells += "<div></div>";
  for (let d=1; d<=days; d++){
    const dt = new Date(y, mo, d), open = isOpen(dt), sel = S.date && ymd(S.date) === ymd(dt);
    cells += `<button data-date="${ymd(dt)}" ${open?"":"disabled"} class="${sel?"sel":""}"
      aria-label="${mo+1}月${d}日${open?"":"（受付なし）"}" aria-pressed="${sel}">${d}</button>`;
  }
  return `<h2>受取日時を選ぶ</h2>
  <p class="lead">${esc(CONFIG.pickupNote)}</p>
  <div class="panel">
    <div class="calhead">
      <button data-mon="-1" ${canPrev?"":"disabled"}>前の月</button>
      <strong>${y}年${mo+1}月</strong>
      <button data-mon="1" ${canNext?"":"disabled"}>次の月</button>
    </div>
    <div class="cal">${cells}</div>
    <div class="legend"><span class="a">選べる日</span><span class="b">受付なし</span><span class="c">選択中</span></div>
  </div>
  <div class="panel">
    <h3>受取時間</h3>
    ${S.date
      ? `<div class="slots">${CONFIG.timeSlots.map(t =>
          `<button data-slot="${esc(t)}" class="${S.slot===t?"sel":""}" aria-pressed="${S.slot===t}">${esc(t)}</button>`).join("")}</div>`
      : `<p class="hint">先に受取日を選んでください。</p>`}
  </div>
  <button class="back" data-go="1">← 商品を選び直す</button>`;
}

function viewInfo(){
  const bad = k => S.tried && !valid()[k] ? "bad" : "";
  return `<h2>お客様情報</h2>
  <p class="lead">ご予約の確認のため、ご連絡先を入力してください。</p>
  <div class="panel">
    <div class="notice">${esc(CONFIG.pickupNote)}</div>
    <div class="field ${bad("name")}">
      <label for="fName">お名前<span class="req">必須</span></label>
      <input id="fName" autocomplete="name" value="${esc(S.name)}" placeholder="山田 花子">
      <div class="err">お名前を入力してください</div>
    </div>
    <div class="field ${bad("phone")}">
      <label for="fPhone">電話番号<span class="req">必須</span></label>
      <input id="fPhone" type="tel" inputmode="tel" autocomplete="tel" value="${esc(S.phone)}" placeholder="090-1234-5678">
      <div class="err">電話番号を10〜11桁で入力してください</div>
    </div>
    <div class="field ${bad("email")}">
      <label for="fEmail">メールアドレス<span class="opt">任意</span></label>
      <input id="fEmail" type="email" autocomplete="email" value="${esc(S.email)}" placeholder="example@mail.com">
      <div class="err">メールアドレスの形式を確認してください</div>
    </div>
    <div class="field">
      <label for="fNote">お店へのご連絡<span class="opt">任意</span></label>
      <textarea id="fNote" placeholder="のし希望、受取時間のご相談など">${esc(S.note)}</textarea>
    </div>
    <label class="check ${bad("agree")}">
      <input type="checkbox" id="fAgree" ${S.agree?"checked":""}>
      <span>ご予約内容と受け取りについての注意を確認しました${S.tried&&!S.agree?'<br><span style="color:var(--berry);font-size:13px">チェックを入れてください</span>':""}</span>
    </label>
  </div>
  <button class="back" data-go="2">← 受取日時を選び直す</button>`;
}

function viewDone(){
  const txt = orderText();
  return `<div class="done-card panel">
    <h2 style="margin-top:0">仮予約を受け付けました</h2>
    <div class="must"><b>まだ予約は完了していません。</b><br>のちほど在庫状況等を確認し、公式LINEより連絡をいたします。しばらくお待ちください。</div>
    <pre class="txt" id="txt">${esc(txt)}</pre>
    <button class="btn ghost" id="copy">仮予約の内容をコピー</button>
    <button class="back" id="restart">新しく予約する</button>
  </div>`;
}

function renderSummary(){
  const its = items(), c = count(), t = total();
  const next = {1:"受取日時を選ぶ",2:"お客様情報へ",3:"予約内容を確認"}[S.step];
  $("#summary").innerHTML = `<h3>ご予約の商品</h3>
    <div class="when">
      <span class="chip ${S.date?"ok":""}">${S.date ? jpDate(S.date) : "受取日 未選択"}</span>
      <span class="chip ${S.slot?"ok":""}">${S.slot || "受取時間 未選択"}</span>
    </div>
    <ul class="lines">${its.length ? its.map(p =>
      `<li><span>${esc(p.name)} × ${S.qty[p.id]}</span><span>${yen(p.price*S.qty[p.id])}</span></li>`).join("")
      : `<li class="empty">まだ商品が選ばれていません</li>`}</ul>
    <div class="total"><span>合計（${c}点）</span><b>${yen(t)}</b></div>
    <button class="btn" id="sideNext" ${canNext()?"":"disabled"}>${next}</button>
    <p class="pay">${esc(CONFIG.payNote)}</p>`;
  $("#barCount").textContent = `${c}点選択中`;
  $("#barTotal").textContent = yen(t);
  $("#barNext").textContent = next || "";
  $("#barNext").disabled = !canNext();
}

function valid(){
  return {
    name: S.name.trim().length > 0,
    phone: /^\d{10,11}$/.test(S.phone.replace(/[-ー－\s]/g,"").replace(/[０-９]/g, d => String.fromCharCode(d.charCodeAt(0)-65248))),
    email: !S.email.trim() || /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(S.email.trim()),
    agree: S.agree
  };
}
function canNext(){
  if (S.step === 1) return count() > 0;
  if (S.step === 2) return !!(S.date && S.slot);
  if (S.step === 3) return true; // 押したときに入力チェック
  return false;
}
function next(){
  if (!canNext()) return;
  if (S.step === 3){
    S.tried = true;
    const v = valid();
    if (!Object.values(v).every(Boolean)){ render(); const f = document.querySelector(".bad input"); f && f.focus(); return; }
    return openConfirm();
  }
  S.step++; render(); window.scrollTo({top:0,behavior:"smooth"});
}

/* ---------- 確認 ---------- */
function openConfirm(){
  $("#sheet").innerHTML = `<h2 id="mTitle">この内容で仮予約しますか？</h2>
    <p class="hint">在庫状況等を確認のうえ、公式LINEよりご連絡します。</p>
    <div class="when" style="margin-top:12px"><span class="chip ok">${jpDate(S.date)}</span><span class="chip ok">${esc(S.slot)}</span></div>
    <ul class="lines">${items().map(p => `<li><span>${esc(p.name)} × ${S.qty[p.id]}</span><span>${yen(p.price*S.qty[p.id])}</span></li>`).join("")}</ul>
    <div class="total"><span>合計（${count()}点）</span><b>${yen(total())}</b></div>
    <dl class="dl">
      <dt>お名前</dt><dd>${esc(S.name)}</dd>
      <dt>電話番号</dt><dd>${esc(S.phone)}</dd>
      ${S.email?`<dt>メール</dt><dd>${esc(S.email)}</dd>`:""}
      ${S.note?`<dt>ご連絡</dt><dd>${esc(S.note)}</dd>`:""}
    </dl>
    <div class="row">
      <button class="btn ghost" id="mBack" style="flex:1">戻る</button>
      <button class="btn" id="mOk" style="flex:2">仮予約する</button>
    </div>`;
  $("#modal").classList.add("open");
  $("#mOk").focus();
  $("#mBack").onclick = closeConfirm;
  $("#mOk").onclick = () => {
    closeConfirm(); S.step = 4; render(); window.scrollTo({top:0});
  };
}
function closeConfirm(){ $("#modal").classList.remove("open"); }
$("#modal").addEventListener("click", e => { if (e.target.id === "modal") closeConfirm(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeConfirm(); });

function orderText(){
  return [
    "【いちご仮予約】",
    `受取日時：${jpDate(S.date)} ${S.slot}`,
    ...items().map(p => `・${p.name} × ${S.qty[p.id]}（${yen(p.price*S.qty[p.id])}）`),
    `合計：${yen(total())}（${count()}点）`,
    `お名前：${S.name}`,
    `電話番号：${S.phone}`,
    S.email ? `メール：${S.email}` : "",
    S.note ? `ご連絡：${S.note}` : ""
  ].filter(Boolean).join("\n");
}

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),1800); }

/* ---------- 操作 ---------- */
function bind(){
  document.querySelectorAll("[data-inc]").forEach(b => b.onclick = () => { S.qty[b.dataset.inc]++; render(); document.querySelector(`[data-inc="${b.dataset.inc}"]`)?.focus(); });
  document.querySelectorAll("[data-dec]").forEach(b => b.onclick = () => { S.qty[b.dataset.dec]--; render(); document.querySelector(`[data-dec="${b.dataset.dec}"]:not(:disabled)`)?.focus() || document.querySelector(`[data-inc="${b.dataset.dec}"]`)?.focus(); });
  document.querySelectorAll("[data-date]").forEach(b => b.onclick = () => { const [y,m,d]=b.dataset.date.split("-").map(Number); S.date=new Date(y,m-1,d); render(); document.querySelector(".slots button")?.focus(); });
  document.querySelectorAll("[data-slot]").forEach(b => b.onclick = () => { S.slot=b.dataset.slot; render(); });
  document.querySelectorAll("[data-mon]").forEach(b => b.onclick = () => { S.month=new Date(S.month.getFullYear(), S.month.getMonth()+ +b.dataset.mon, 1); render(); });
  document.querySelectorAll("[data-go]").forEach(b => b.onclick = () => { S.step=+b.dataset.go; render(); window.scrollTo({top:0}); });
  const bindIn = (id,key) => { const el=$(id); if(el) el.oninput = () => { S[key]=el.value; if(S.tried){ el.closest(".field").classList.toggle("bad", !valid()[key]); } }; };
  bindIn("#fName","name"); bindIn("#fPhone","phone"); bindIn("#fEmail","email"); bindIn("#fNote","note");
  const ag=$("#fAgree"); if(ag) ag.onchange = () => { S.agree=ag.checked; };
  const sn=$("#sideNext"); if(sn) sn.onclick = next;
  const cp=$("#copy"); if(cp) cp.onclick = async () => {
    const txt = orderText();
    try { await navigator.clipboard.writeText(txt); toast("コピーしました"); }
    catch { const r=document.createRange(); r.selectNodeContents($("#txt")); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast("文字を長押ししてコピーしてください"); }
  };
  const rs=$("#restart"); if(rs) rs.onclick = () => {
    Object.keys(S.qty).forEach(k=>S.qty[k]=0);
    Object.assign(S,{step:1,date:null,slot:null,name:"",phone:"",email:"",note:"",agree:false,orderNo:null,tried:false});
    render(); window.scrollTo({top:0});
  };
}
$("#barNext").onclick = next;

render();
</script>
</body>
</html>
