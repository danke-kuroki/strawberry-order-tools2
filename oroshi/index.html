<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>暖家のいちご 業者様向けご予約フォーム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>

/* =========================================================
   色の設定（ライト / ダーク）
   ========================================================= */
:root{
  --bg:#FFF7F5; --paper:#FFFFFF; --ink:#24382B; --sub:#5E6F63; --line:#EBDAD6;
  --berry:#D42A45; --berry-d:#A81C33; --berry-soft:#FCE3E6;
  --leaf:#2F6B3F; --leaf-soft:#E3F0E5; --muted:#F4EDEB; --dis:#C3B7B4;
  --seed:#FFD98A;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1B1716; --paper:#26201F; --ink:#F2ECEA; --sub:#B9AEAA; --line:#403634;
    --berry:#EE5069; --berry-d:#FF8A9C; --berry-soft:#45242A;
    --leaf:#7CC48D; --leaf-soft:#1F3325; --muted:#2F2826; --dis:#5E5350;
    --seed:#F5CB6E; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1B1716; --paper:#26201F; --ink:#F2ECEA; --sub:#B9AEAA; --line:#403634;
  --berry:#EE5069; --berry-d:#FF8A9C; --berry-soft:#45242A;
  --leaf:#7CC48D; --leaf-soft:#1F3325; --muted:#2F2826; --dis:#5E5350;
  --seed:#F5CB6E; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
  font-weight:500; font-size:16px; line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--leaf);outline-offset:2px}

/* ---------- ヘッダー：いちごの表皮 ---------- */
.hero{
  background-color:#D42A45;
  background-image:
    radial-gradient(ellipse 3px 4.5px at 20px 18px,var(--seed) 98%,transparent),
    radial-gradient(ellipse 3px 4.5px at 52px 42px,var(--seed) 98%,transparent);
  background-size:64px 56px;
  color:#fff; text-align:center;
  padding:28px 20px 34px; position:relative;
}
.hero::after{
  content:""; position:absolute; left:0; right:0; bottom:-1px; height:14px;
  background:radial-gradient(circle at 10px -2px,transparent 11px,var(--bg) 12px) 0 0/20px 14px repeat-x;
}
.hero h1{
  margin:0; font-weight:900; font-size:clamp(28px,6vw,44px); letter-spacing:.06em; line-height:1.25;
  text-shadow:0 2px 0 #A81C33;
}
.hero p{margin:6px 0 0;font-size:14px;opacity:.95}

/* ---------- ステップ ---------- */
.steps{display:flex;justify-content:center;gap:0;margin:26px auto 8px;max-width:440px;padding:0 20px;list-style:none}
.steps li{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;font-size:13px;color:var(--sub)}
.steps li::before{
  content:""; position:absolute; top:17px; left:-50%; width:100%; height:2px; background:var(--line); z-index:0;
}
.steps li:first-child::before{display:none}
.steps .dot{
  width:36px;height:36px;border-radius:50%;display:grid;place-items:center;
  background:var(--muted);color:var(--sub);font-weight:900;position:relative;z-index:1;margin-bottom:4px;
}
.steps li.done .dot{background:var(--leaf);color:var(--paper)}
.steps li.done::before,.steps li.now::before{background:var(--leaf)}
.steps li.now .dot{background:var(--berry);color:#fff;box-shadow:0 0 0 5px var(--berry-soft)}
.steps li.now{color:var(--ink);font-weight:700}

/* ---------- レイアウト ---------- */
.wrap{max-width:1080px;margin:0 auto;padding:12px 16px 120px;display:grid;gap:24px}
@media (min-width:900px){
  .wrap{grid-template-columns:minmax(0,1fr) 330px;align-items:start;padding-bottom:60px}
}
h2{font-size:24px;font-weight:900;margin:12px 0 4px;letter-spacing:.04em}
.lead{margin:0 0 18px;color:var(--sub);font-size:14px}

/* ---------- 商品 ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.item{
  background:var(--paper);border:2px solid var(--line);border-radius:18px;
  padding:14px 14px 16px;display:flex;flex-direction:column;transition:border-color .15s;
}
.item.on{border-color:var(--berry);background:linear-gradient(var(--paper),var(--paper)) padding-box}
.item .pic{
  aspect-ratio:4/3;overflow:hidden;border-radius:12px;background:var(--berry-soft);display:grid;place-items:center;margin-bottom:12px;position:relative;
}
.item.white .pic{background:var(--leaf-soft)}
.item .pic svg{width:84px;height:84px}
.item .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.item .tag{z-index:1}
.points{list-style:none;margin:6px 0 12px;padding:0;flex:1;font-size:13px;color:var(--sub);line-height:1.6}
.points li{position:relative;padding-left:14px;margin-bottom:3px}
.points li::before{content:"";position:absolute;left:2px;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--berry)}
.noship{align-self:flex-start;margin-top:4px;font-size:12px;font-weight:700;color:var(--berry-d);background:var(--berry-soft);padding:1px 10px;border-radius:999px}
.item .tag{
  position:absolute;left:8px;top:8px;background:var(--paper);color:var(--ink);
  font-size:12px;padding:2px 10px;border-radius:999px;font-weight:700
}
.item h3{margin:0;font-size:19px;font-weight:900;line-height:1.4}
.item .desc{margin:2px 0 8px;font-size:13px;color:var(--sub);line-height:1.6;flex:1}
.item .price{font-weight:900;color:var(--berry);font-size:19px;margin-bottom:10px}
.item .price small{font-size:12px;color:var(--sub);font-weight:500;margin-left:2px}
.stepper{display:flex;align-items:center;justify-content:space-between;background:var(--muted);border-radius:999px;padding:4px}
.stepper button{
  width:40px;height:40px;border-radius:50%;border:0;cursor:pointer;font-size:22px;font-weight:700;line-height:1;
  background:var(--berry);color:#fff;
}
.stepper button.minus{background:var(--paper);color:var(--berry);border:2px solid var(--berry-soft)}
.stepper button:disabled{background:var(--muted);color:var(--dis);border-color:transparent;cursor:default}
.stepper output{font-size:20px;font-weight:900;min-width:2em;text-align:center}
.soldout .stepper{opacity:.5}

/* ---------- カレンダー ---------- */
.panel{background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:18px}
.panel + .panel{margin-top:16px}
.panel h3{margin:0 0 12px;font-size:17px;font-weight:900}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.calhead strong{font-size:18px}
.calhead button{
  border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 14px;cursor:pointer;font-size:14px;font-weight:700
}
.calhead button:disabled{opacity:.35;cursor:default}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal .wd{font-size:12px;color:var(--sub);font-weight:700;padding-bottom:2px}
.cal .wd.sun{color:var(--berry)} .cal .wd.sat{color:#3B74C4}
.cal button{
  aspect-ratio:1/1;max-height:56px;width:100%;border-radius:12px;border:2px solid var(--line);
  background:var(--paper);cursor:pointer;font-weight:700;font-size:15px;padding:0
}
.cal button:disabled{background:var(--muted);color:var(--dis);border-color:transparent;cursor:default}
.cal button.sel{background:var(--berry);border-color:var(--berry);color:#fff}
.legend{display:flex;gap:14px;margin-top:10px;font-size:12px;color:var(--sub);flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:-1px}
.legend .a::before{border:2px solid var(--line);background:var(--paper)}
.legend .b::before{background:var(--muted)}
.legend .c::before{background:var(--berry)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.slots button{
  border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:12px 8px;cursor:pointer;font-weight:700
}
.slots button.sel{background:var(--leaf);border-color:var(--leaf);color:var(--paper)}
.hint{font-size:13px;color:var(--sub);margin:0}

/* ---------- フォーム ---------- */
.field{margin-bottom:16px}
.field label{display:block;font-weight:700;font-size:14px;margin-bottom:4px}
.field label .req{color:var(--berry);margin-left:4px;font-size:12px}
.field label .opt{color:var(--sub);margin-left:4px;font-size:12px;font-weight:500}
.field input,.field textarea{
  width:100%;border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:11px 13px;font-size:16px
}
.field textarea{min-height:84px;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--leaf);outline:none}
.field .err{color:var(--berry);font-size:13px;margin-top:3px;display:none}
.field.bad .err{display:block}
.field.bad input{border-color:var(--berry)}
.notice{background:var(--leaf-soft);border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:12px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer;margin-bottom:18px}
.check input{width:22px;height:22px;accent-color:var(--berry);flex:none;margin-top:1px}

/* ---------- サマリー ---------- */
.summary{background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:18px}
@media (min-width:900px){.summary{position:sticky;top:calc(16px + env(safe-area-inset-top,0px))}}
.summary h3{margin:0 0 10px;font-size:17px;font-weight:900}
.when{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{font-size:13px;padding:3px 11px;border-radius:999px;background:var(--muted);color:var(--sub);font-weight:700}
.chip.ok{background:var(--leaf-soft);color:var(--leaf)}
.lines{list-style:none;margin:0;padding:0}
.lines li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
.lines .empty{color:var(--sub);justify-content:center}
.total{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px}
.total b{font-size:26px;color:var(--berry);font-weight:900}
.pay{font-size:12px;color:var(--sub);margin:8px 0 0;text-align:center}

.btn{
  display:block;width:100%;border:0;border-radius:999px;padding:15px 18px;font-weight:900;font-size:17px;cursor:pointer;
  background:var(--berry);color:#fff;box-shadow:0 4px 0 var(--berry-d);text-align:center;text-decoration:none;
  margin-top:14px;
}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--berry-d)}
.btn:disabled{background:var(--muted);color:var(--dis);box-shadow:none;cursor:default}
.btn.line{background:#06C755;box-shadow:0 4px 0 #04913E}
.btn.ghost{background:var(--paper);color:var(--ink);border:2px solid var(--line);box-shadow:none;font-weight:700}
.back{background:none;border:0;color:var(--sub);cursor:pointer;padding:8px 0;font-weight:700;margin-top:6px}
.side-only{display:none}
@media (min-width:900px){.side-only{display:block}}

/* ---------- スマホ用の下部バー ---------- */
.bar{
  position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);border-top:2px solid var(--line);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:center
}
.bar .info{flex:1;font-size:13px;color:var(--sub);line-height:1.3}
.bar .info b{display:block;font-size:20px;color:var(--berry);font-weight:900}
.bar .btn{width:auto;margin:0;padding:12px 20px;font-size:16px}
@media (min-width:900px){.bar{display:none}}

/* ---------- 確認モーダル ---------- */
.modal{position:fixed;inset:0;z-index:40;background:rgba(20,10,10,.5);display:none;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
@media (min-width:600px){.modal{align-items:center}}
.sheet{
  background:var(--paper);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom,0px));
  max-height:92vh;overflow:auto;animation:up .22s ease-out
}
@media (min-width:600px){.sheet{border-radius:22px}}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet h2{margin:0 0 4px}
.dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;background:var(--muted);border-radius:14px;padding:14px;font-size:14px;margin-top:14px}
.dl dt{color:var(--sub)} .dl dd{margin:0;word-break:break-all}
.row{display:flex;gap:10px} .row .btn{margin-top:16px}

/* ---------- 完了 ---------- */
.done-card{max-width:560px;margin:0 auto;text-align:center}
.num{font-size:44px;font-weight:900;letter-spacing:.12em;color:var(--berry);margin:4px 0}
.must{background:var(--berry-soft);border-radius:14px;padding:14px;font-size:15px;margin:16px 0 4px;text-align:left}
pre.txt{white-space:pre-wrap;text-align:left;background:var(--muted);border-radius:14px;padding:14px;font:inherit;font-size:14px;margin:14px 0 0}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
[hidden]{display:none!important}

/* ---------- 業者向け：規格ごとの行 ---------- */
.groups{display:grid;gap:18px}
.group{background:var(--paper);border:2px solid var(--line);border-radius:18px;overflow:hidden}
.ghead{display:flex;gap:14px;align-items:center;padding:14px;border-bottom:2px solid var(--line)}
.gpic{width:104px;height:78px;flex:none;border-radius:12px;overflow:hidden;background:var(--berry-soft);display:grid;place-items:center}
.gpic img{width:100%;height:100%;object-fit:cover;display:block}
.gpic svg{width:56px;height:56px}
.group.frozen .gpic{background:var(--leaf-soft)}
.gphotos{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:14px 14px 0}
.gphotos img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;display:block;background:var(--muted)}
.ghead h3{margin:0;font-size:20px;font-weight:900;line-height:1.35}
.ghead p{margin:3px 0 0;font-size:13px;color:var(--sub);line-height:1.5}
.grow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;align-items:center;padding:12px 14px;border-bottom:1px dashed var(--line)}
.grow:last-child{border-bottom:0}
.grow.on{background:var(--berry-soft)}
.grade{font-weight:900;font-size:19px;line-height:1.3}
.spec{font-size:12.5px;color:var(--sub);line-height:1.55;margin-top:2px}
.pline{margin-top:4px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.gprice{font-weight:900;color:var(--berry);font-size:16px}
.gprice small{font-size:12px;color:var(--sub);font-weight:500}
.unitnote{font-size:11.5px;background:var(--leaf-soft);color:var(--leaf);border-radius:999px;padding:1px 9px;font-weight:700}
.grow .stepper{min-width:156px}
.grow .stepper output{min-width:3.2em;font-size:18px}
.grow .stepper output small{font-size:11px;color:var(--sub);font-weight:700;margin-left:1px}
@media (max-width:540px){.grow{grid-template-columns:1fr}.grow .stepper{min-width:0}}
.gfoot{font-size:12px;color:var(--sub);padding:8px 14px 12px;margin:0}
.req-box{margin-top:18px}
.req-box p{margin:0 0 8px;font-size:14px;color:var(--sub)}
.field select{
  width:100%;border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:11px 13px;font-size:16px;color:var(--ink)
}
.field select.empty{color:var(--sub);font-size:14px}
.field select:focus{border-color:var(--leaf);outline:none}
.seg{display:flex;gap:8px}
.seg label{flex:1;position:relative;border:2px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;cursor:pointer;font-weight:700;font-size:15px;background:var(--paper)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--leaf);border-color:var(--leaf);color:var(--paper)}
.seg label:has(input:focus-visible){outline:3px solid var(--leaf);outline-offset:2px}
.field.bad .seg label{border-color:var(--berry)}
.field .help{font-size:12.5px;color:var(--sub);margin-top:3px}
.lines li.ship{border-bottom:0;padding-bottom:2px}
.lines li .boxes{display:block;font-size:12px;color:var(--sub)}
.subrow{display:flex;justify-content:space-between;font-size:14px;padding:6px 0}
.subrow.muted{color:var(--sub);font-size:13px}
.notes{font-size:13px;color:var(--sub);margin:12px 0 0;padding-left:0;list-style:none}
.ziprow{display:flex;gap:8px;align-items:stretch}
.ziprow input{flex:1;min-width:0}
.zipbtn{flex:none;border:2px solid var(--leaf);background:var(--paper);color:var(--leaf);border-radius:12px;padding:0 14px;font-weight:700;font-size:14px;cursor:pointer}
.zipbtn:disabled{opacity:.5;cursor:default}
.addrbox{border-left:4px solid var(--leaf-soft);padding-left:12px;margin-bottom:16px}
</style>
</head>
<body>

<header class="hero">
  <h1 id="farmName">暖家のいちご</h1>
  <p id="farmTag">業者様向け ご予約フォーム</p>
</header>

<ol class="steps" id="steps" aria-label="予約の手順">
  <li data-s="1"><span class="dot">1</span>商品</li>
  <li data-s="2"><span class="dot">2</span>受取日時</li>
  <li data-s="3"><span class="dot">3</span>お客様情報</li>
</ol>

<main class="wrap" id="main">
  <section id="view"></section>
  <aside class="summary side-only" id="summary" aria-live="polite"></aside>
</main>

<div class="bar" id="bar">
  <div class="info"><span id="barCount">0点</span><b id="barTotal">¥0</b></div>
  <button class="btn" id="barNext">次へ</button>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="sheet" id="sheet"></div>
</div>

/* ---------- 送料の自動計算 ---------- */
function rateTable(pref){
  const r = REGIONS.indexOf(PREF_REGION[pref]);
  if (r < 0) return null;
  const t = {}; for (const z in RATES) t[z] = RATES[z][r];
  return t;
}
// 1個口の荷物：2パック用の箱 a 個と4パック用の箱 b 個を縦に積む
// 底面は大きい方の箱、高さは箱の高さの合計。3辺の合計でサイズを決める
function parcelDims(a, b){
  const base = b ? BOX.small : BOX.big;
  const h = Math.round((a*BOX.big.h + b*BOX.small.h) * 10) / 10;
  return { l:base.l, w:base.w, h, sum: Math.round((base.l + base.w + h) * 10) / 10 };
}
function parcelFee(a, b, rate){
  const d = parcelDims(a, b);
  const z = SIZES.find(x => d.sum <= x && rate[x] != null);   // 使えないサイズ（沖縄の120など）は1つ上へ
  return z ? { z, fee:rate[z], a, b, ...d } : null;
}
// 140サイズを超える場合は複数個口に分け、送料の合計が最安になる分け方を探す
function packParcels(A, B, rate){
  const list = [];
  const maxA = (() => { let n=0; while (parcelFee(n+1,0,rate)) n++; return n; })();
  const maxB = (() => { let n=0; while (parcelFee(0,n+1,rate)) n++; return n; })();
  while (A > maxA*2){ list.push(parcelFee(maxA,0,rate)); A -= maxA; }
  while (B > maxB*2){ list.push(parcelFee(0,maxB,rate)); B -= maxB; }
  const W = B + 1, f = new Float64Array((A+1)*W).fill(Infinity), ch = new Array((A+1)*W);
  f[0] = 0;
  for (let i=0;i<=A;i++) for (let j=0;j<=B;j++){
    if (!i && !j) continue;
    for (let a=0;a<=i;a++) for (let b=0;b<=j;b++){
      if (!a && !b) continue;
      const pf = parcelFee(a,b,rate); if (!pf) { if (b===0) break; else continue; }
      const v = pf.fee + f[(i-a)*W + (j-b)];
      if (v < f[i*W+j]){ f[i*W+j] = v; ch[i*W+j] = pf; }
    }
  }
  if (!isFinite(f[A*W+B])) return null;
  let i=A, j=B; while (i || j){ const c = ch[i*W+j]; list.push(c); i -= c.a; j -= c.b; }
  return list;
}
const sumParcels = list => list.reduce((x,p) => x + p.fee, 0);
const parcelText = list => {
  const c = {}; list.forEach(p => c[p.z] = (c[p.z]||0) + 1);
  return Object.keys(c).sort((a,b)=>b-a).map(z => `${z}サイズ×${c[z]}`).join("・");
};
let shipCache = { key:null, val:null };
function shipping(){
  const key = S.pref + "|" + ALL.map(it => S.qty[it.id]).join(",");
  if (shipCache.key !== key) shipCache = { key, val: calcShipping() };
  return shipCache.val;
}
function calcShipping(){
  if (!S.pref || !count()) return null;
  const rate = rateTable(S.pref); if (!rate) return null;
  let big=0, small=0, kg=0;
  items().forEach(it => {
    if (it.frozen) kg += S.qty[it.id];
    else if (it.size === "big") big += S.qty[it.id];
    else small += S.qty[it.id];
  });
  const res = { parts:[], total:0 };
  if (big + small){   // 生果：2パック用の箱は2パックで1箱、4パック用の箱は4パックで1箱
    const l = packParcels(Math.ceil(big/2), Math.ceil(small/4), rate);
    if (!l) return null;
    res.parts.push({ name:"生果", boxes:parcelText(l), fee:sumParcels(l) });
  }
  if (kg){            // 冷凍：1kgを2パック用の箱1つに詰め、生果とは別便
    const l = packParcels(kg, 0, rate);
    if (!l) return null;
    res.parts.push({ name:"冷凍", boxes:parcelText(l), fee:sumParcels(l) });
  }
  res.total = res.parts.reduce((a,p) => a + p.fee, 0);
  return res;
}

/* ---------- 画面の描画 ---------- */
function render(){
  document.querySelectorAll("#steps li").forEach(li => {
    const n = +li.dataset.s;
    li.className = S.step === 4 || n < S.step ? "done" : n === S.step ? "now" : "";
    li.querySelector(".dot").textContent = (S.step === 4 || n < S.step) ? "✓" : n;
    if (n === S.step) li.setAttribute("aria-current","step"); else li.removeAttribute("aria-current");
  });
  const v = $("#view");
  if (S.step === 1) v.innerHTML = viewProducts();
  if (S.step === 2) v.innerHTML = viewDate();
  if (S.step === 3) v.innerHTML = viewInfo();
  if (S.step === 4) v.innerHTML = viewDone();
  $("#main").style.gridTemplateColumns = S.step === 4 ? "1fr" : "";
  $("#summary").hidden = S.step === 4;
  $("#bar").hidden = S.step === 4;
  renderSummary();
  bind();
}

function viewDate(){
  const m = S.month, y = m.getFullYear(), mo = m.getMonth();
  const start = new Date(y, mo, 1), days = new Date(y, mo+1, 0).getDate();
  const canPrev = new Date(y, mo, 0) >= new Date(firstDay.getFullYear(), firstDay.getMonth(), 1);
  const canNext = new Date(y, mo+1, 1) <= lastDay;
  let cells = WD.map((w,i) => `<div class="wd ${i===0?"sun":i===6?"sat":""}">${w}</div>`).join("");
  for (let i=0;i<start.getDay();i++) cells += "<div></div>";
  for (let d=1; d<=days; d++){
    const dt = new Date(y, mo, d), open = isOpen(dt), sel = S.date && ymd(S.date) === ymd(dt);
    cells += `<button data-date="${ymd(dt)}" ${open?"":"disabled"} class="${sel?"sel":""}"
      aria-label="${mo+1}月${d}日${open?"":"（受付なし）"}" aria-pressed="${sel}">${d}</button>`;
  }
  return `<h2>受取日時を選ぶ</h2>
  <div class="panel">
    <h3>受取日</h3>
    <p class="hint" style="margin:-6px 0 12px">※発送希望のお客様は到着希望日をお選びください。</p>
    <div class="calhead">
      <button data-mon="-1" ${canPrev?"":"disabled"}>前の月</button>
      <strong>${y}年${mo+1}月</strong>
      <button data-mon="1" ${canNext?"":"disabled"}>次の月</button>
    </div>
    <div class="cal">${cells}</div>
    <div class="legend"><span class="a">選べる日</span><span class="b">受付なし</span><span class="c">選択中</span></div>
  </div>
  <div class="panel">
    <h3>受取時間</h3>
    <p class="hint" style="margin:-6px 0 12px">※発送希望のお客様は到着希望時間帯をお選びください。</p>
    ${S.date
      ? `<div class="slots">${CONFIG.timeSlots.map(t =>
          `<button data-slot="${esc(t)}" class="${S.slot===t?"sel":""}" aria-pressed="${S.slot===t}">${esc(t)}</button>`).join("")}</div>`
      : `<p class="hint">先に受取日を選んでください。</p>`}
  </div>
  <button class="back" data-go="1">← 商品を選び直す</button>`;
}

function renderSummary(){
  const n = count(), sh = shipping();
  const next = {1:"受取日時を選ぶ",2:"お客様情報へ",3:"予約内容を確認"}[S.step];
  $("#summary").innerHTML = `<h3>ご予約の商品</h3>
    <div class="when">
      <span class="chip ${S.date?"ok":""}">${S.date ? jpDate(S.date) : "受取日 未選択"}</span>
      <span class="chip ${S.slot?"ok":""}">${S.slot || "受取時間 未選択"}</span>
    </div>
    <ul class="lines">${n ? itemLines() : `<li class="empty">まだ商品が選ばれていません</li>`}</ul>
    ${n ? `<div class="subrow"><span>商品小計</span><span>${yen(subtotal())}</span></div>${shipBlock()}` : ""}
    <div class="total"><span>合計${sh?"（送料込）":""}</span><b>${yen(grand())}</b></div>
    ${tempNote()}
    <button class="btn" id="sideNext" ${canNext()?"":"disabled"}>${next}</button>
    ${CONFIG.payNote ? `<p class="pay">${esc(CONFIG.payNote)}</p>` : ""}`;
  $("#barCount").textContent = `${n}規格選択中`;
  $("#barTotal").textContent = yen(grand());
  $("#barNext").textContent = next || "";
  $("#barNext").disabled = !canNext();
}

const normPhone = p => p.replace(/[０-９]/g, d => String.fromCharCode(d.charCodeAt(0)-65248)).replace(/[-ー－‐\s]/g,"");
function valid(){
  const first = S.first === "yes";
  const ph = S.phone.trim();
  return {
    first: !!S.first,
    name: S.name.trim().length > 0,
    phone: ph ? /^\d{10,11}$/.test(normPhone(ph)) : !first,
    line: first ? S.line.trim().length > 0 : true,
    addr1: first ? S.addr1.trim().length > 0 : true,
    addr2: first ? S.addr2.trim().length > 0 : true,
    email: !S.email.trim() || /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(S.email.trim()),
    agree: S.agree
  };
}
function canNext(){
  if (S.step === 1) return count() > 0;
  if (S.step === 2) return !!(S.date && S.slot);
  if (S.step === 3) return true;
  return false;
}
function next(){
  if (!canNext()) return;
  if (S.step === 3){
    S.tried = true;
    if (!Object.values(valid()).every(Boolean)){
      render();
      const f = document.querySelector(".field.bad input, .field.bad select");
      f && f.focus(); return;
    }
    return openConfirm();
  }
  S.step++; render(); window.scrollTo({top:0,behavior:"smooth"});
}

/* ---------- 確認ポップアップ ---------- */
function openConfirm(){
  const sh = shipping();
  $("#sheet").innerHTML = `<h2 id="mTitle">この内容で仮予約しますか？</h2>
    <p class="hint">在庫状況等を確認のうえ、公式LINEよりご連絡します。</p>
    <div class="when" style="margin-top:12px"><span class="chip ok">${jpDate(S.date)}</span><span class="chip ok">${esc(S.slot)}</span></div>
    <ul class="lines">${itemLines()}</ul>
    <div class="subrow"><span>商品小計</span><span>${yen(subtotal())}</span></div>
    ${shipBlock()}
    <div class="total"><span>合計${sh?"（送料込）":""}</span><b>${yen(grand())}</b></div>
    ${tempNote()}
    ${!S.pref ? `<p class="hint" style="margin-top:6px">発送をご希望の場合、送料は別途かかります。</p>` : ""}
    <p class="hint" id="sendErr" style="color:var(--berry);margin-top:8px" hidden></p>
    <dl class="dl">
      <dt>お名前</dt><dd>${esc(S.name)}</dd>
      ${S.phone?`<dt>電話番号</dt><dd>${esc(S.phone)}</dd>`:""}
      ${S.line?`<dt>LINE表示名</dt><dd>${esc(S.line)}</dd>`:""}
      ${addrText()?`<dt>住所</dt><dd>${esc(addrText())}</dd>`:""}
      ${S.email?`<dt>メール</dt><dd>${esc(S.email)}</dd>`:""}
      ${S.pref?`<dt>お渡し先</dt><dd>${esc(S.pref)}</dd>`:""}
      ${S.note?`<dt>ご要望</dt><dd>${esc(S.note)}</dd>`:""}
    </dl>
    <div class="row">
      <button class="btn ghost" id="mBack" style="flex:1">戻る</button>
      <button class="btn" id="mOk" style="flex:2">仮予約する</button>
    </div>`;
  $("#modal").classList.add("open");
  $("#mOk").focus();
  $("#mBack").onclick = closeConfirm;
  $("#mOk").onclick = async () => {
    const btn = $("#mOk"), err = $("#sendErr");
    btn.disabled = true; btn.textContent = "送信中…"; err.hidden = true;
    try {
      await sendToSheet();
      closeConfirm(); S.step = 4; render(); window.scrollTo({top:0});
    } catch (e) {
      err.textContent = e.message || "送信できませんでした。通信環境をご確認のうえ、もう一度お試しください。";
      err.hidden = false; btn.disabled = false; btn.textContent = "仮予約する";
    }
  };
}
/* ---------- スプレッドシートへ送信 ---------- */
// 見出し名（空白を除いた形）ごとの値を送ります。白2Lの列がシートにない場合は備考に入ります
function sheetPayload(){
  const sh = shipping(), cols = {};
  const add = (key, price, qty) => {
    if (!qty) return;
    cols[key+"値段"] = price;
    cols[key+"数量"] = (cols[key+"数量"] || 0) + qty;
  };
  items().forEach(it => {
    const q = S.qty[it.id];
    if (it.frozen) return add("冷凍", it.price, q);
    const isWhite = it.id.startsWith("w-");
    if (!isWhite) return add(it.grade, it.price, q);
    if (it.grade === "G")  return add("白G", it.price, q);
    if (it.grade === "2L") return add("白2L", it.price, q);
    return add("白L～S", it.price, q);
  });
  // 備考：初めての方は電話番号・LINE表示名・ご要望、2回目以降の方はご要望のみ
  const memo = (S.first === "yes" ? [
    S.phone ? `TEL：${S.phone}` : "",
    S.line ? `LINE：${S.line}` : "",
    addrText() ? `住所：${addrText()}` : "",
    S.note ? `ご要望・お問い合わせ：${S.note}` : ""
  ] : [
    S.note ? `ご要望・お問い合わせ：${S.note}` : ""
  ]).filter(Boolean).join("／");
  return {
    name: S.name,
    cols,
    shipping: sh ? sh.total : "",
    taxRate: CONFIG.taxRate,
    total: grand(),
    memo,
    text: orderText(),
    date: `${S.date.getFullYear()}/${String(S.date.getMonth()+1).padStart(2,"0")}/${String(S.date.getDate()).padStart(2,"0")}`,
    slot: S.slot
  };
}
async function sendToSheet(){
  if (!CONFIG.sheetEndpoint) throw new Error("送信先（sheetEndpoint）が未設定です。");
  // Apps Script はCORSの応答を返さないため no-cors で送ります（届いたかどうかはシートで確認）
  await fetch(CONFIG.sheetEndpoint, {
    method: "POST", mode: "no-cors",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(sheetPayload())
  });
}
/* ---------- 郵便番号から住所を自動入力（zipcloud） ---------- */
const normZip = z => String(z).replace(/[０-９]/g, d => String.fromCharCode(d.charCodeAt(0)-65248)).replace(/[^0-9]/g, "");
const addrText = () => {
  if (S.first !== "yes") return "";
  const z = normZip(S.zip);
  return [z.length === 7 ? `〒${z.slice(0,3)}-${z.slice(3)}` : "", S.addr1.trim(), S.addr2.trim()].filter(Boolean).join(" ");
};
function lookupZip(zip){
  return new Promise((resolve, reject) => {
    const cb = "zipcb_" + Date.now(), s = document.createElement("script");
    const done = () => { clearTimeout(timer); delete window[cb]; s.remove(); };
    const timer = setTimeout(() => { done(); reject(new Error("timeout")); }, 7000);
    window[cb] = data => { done(); resolve(data); };
    s.onerror = () => { done(); reject(new Error("load")); };
    s.src = `https://zipcloud.ibsnet.co.jp/api/search?zipcode=${zip}&callback=${cb}`;
    document.head.appendChild(s);
  });
}
let zipBusy = false;
async function fillAddress(){
  const zip = normZip(S.zip), msg = $("#zipMsg"), btn = $("#zipBtn");
  if (zip.length !== 7){ msg.textContent = "郵便番号を7桁で入力してください。"; return; }
  if (zipBusy) return;
  zipBusy = true; btn.disabled = true; msg.textContent = "住所を検索しています…";
  try {
    const data = await lookupZip(zip);
    const r = data && data.results && data.results[0];
    if (!r){ msg.textContent = "該当する住所が見つかりませんでした。住所を直接入力してください。"; return; }
    S.addr1 = r.address1 + r.address2 + r.address3;
    $("#fAddr1").value = S.addr1;
    if (S.tried) $("#fAddr1").closest(".field").classList.remove("bad");
    if (!S.pref && PREFS.includes(r.address1)){   // お渡し先都道府県が未入力なら一緒に入れる
      S.pref = r.address1;
      const pf = $("#fPref"); pf.value = S.pref; pf.classList.remove("empty");
      renderSummary(); $("#sideNext").onclick = next;
    }
    msg.textContent = "住所を入力しました。番地・建物名を続けて入力してください。";
    $("#fAddr2").focus();
  } catch {
    msg.textContent = "住所を自動入力できませんでした。住所を直接入力してください。";
  } finally {
    zipBusy = false; btn.disabled = false;
  }
}

/* ---------- 公式LINEの友だち追加 ---------- */
const lineAddUrl = () => `https://line.me/R/ti/p/${encodeURIComponent(CONFIG.lineOaId)}`;

/* ---------- お知らせポップアップ ---------- */
function showNotice(msg, backTo){
  $("#sheet").innerHTML = `<h2 id="mTitle" style="font-size:20px">ご注意</h2>
    <p style="margin:10px 0 0;font-size:16px">${esc(msg)}</p>
    <button class="btn" id="nOk">了解しました</button>`;
  $("#modal").classList.add("open");
  $("#nOk").focus();
  $("#nOk").onclick = () => { closeConfirm(); backTo && document.querySelector(backTo)?.focus(); };
}
function closeConfirm(){ $("#modal").classList.remove("open"); }
$("#modal").addEventListener("click", e => { if (e.target.id === "modal") closeConfirm(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeConfirm(); });

function orderText(){
  const sh = shipping();
  return [
    "【業者様 仮予約】",
    `受取（到着）日時：${jpDate(S.date)} ${S.slot}`,
    ...items().map(it => `・${label(it)} × ${S.qty[it.id]}${unitOf(it)}（${yen(it.price*S.qty[it.id])}）`),
    `商品小計：${yen(subtotal())}`,
    S.pref ? (sh ? `送料：${yen(sh.total)}（${S.pref}／${sh.parts.map(p=>p.name+" "+p.boxes).join("、")}）` : `送料：別途ご連絡（${S.pref}）`) : "",
    `合計：${yen(grand())}${sh?"（送料込）":""}`,
    `ご利用：${S.first==="yes"?"初めて":"2回目以降"}`,
    `お名前：${S.name}`,
    S.phone ? `電話番号：${S.phone}` : "",
    S.line ? `LINE表示名：${S.line}` : "",
    addrText() ? `住所：${addrText()}` : "",
    S.email ? `メール：${S.email}` : "",
    S.note ? `ご要望・お問い合わせ：${S.note}` : ""
  ].filter(Boolean).join("\n");
}

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),1800); }

/* ---------- 操作 ---------- */
function bind(){
  const stepOf = id => ALL.find(it => it.id === id).step;
  document.querySelectorAll("[data-inc]").forEach(b => b.onclick = () => {
    const id = b.dataset.inc, before = S.qty[id];
    S.qty[id] = Math.min(CONFIG.maxPerItem, S.qty[id] + stepOf(id)); render();
    const it = ALL.find(x => x.id === id);
    if (before === 0 && !it.frozen && CONFIG.lateGrades.includes(it.grade)) {
      return showNotice(CONFIG.lateNote, `[data-inc="${id}"]`);
    }
    document.querySelector(`[data-inc="${id}"]:not(:disabled)`)?.focus() || document.querySelector(`[data-dec="${id}"]`)?.focus();
  });
  document.querySelectorAll("[data-dec]").forEach(b => b.onclick = () => {
    const id = b.dataset.dec; S.qty[id] = Math.max(0, S.qty[id] - stepOf(id)); render();
    document.querySelector(`[data-dec="${id}"]:not(:disabled)`)?.focus() || document.querySelector(`[data-inc="${id}"]`)?.focus();
  });
  document.querySelectorAll("[data-date]").forEach(b => b.onclick = () => { const [y,m,d]=b.dataset.date.split("-").map(Number); S.date=new Date(y,m-1,d); render(); document.querySelector(".slots button")?.focus(); });
  document.querySelectorAll("[data-slot]").forEach(b => b.onclick = () => { S.slot=b.dataset.slot; render(); });
  document.querySelectorAll("[data-mon]").forEach(b => b.onclick = () => { S.month=new Date(S.month.getFullYear(), S.month.getMonth()+ +b.dataset.mon, 1); render(); });
  document.querySelectorAll("[data-go]").forEach(b => b.onclick = () => { S.step=+b.dataset.go; render(); window.scrollTo({top:0}); });
  const keyFor = {"#fName":"name","#fPhone":"phone","#fLine":"line","#fEmail":"email"};
  for (const id in keyFor){ const el=$(id); if(el) el.oninput = () => {
    S[keyFor[id]] = el.value;
    if (S.tried) el.closest(".field").classList.toggle("bad", !valid()[keyFor[id]]);
  };}
  const nt=$("#fNote"); if(nt) nt.oninput = () => { S.note = nt.value; };
  const zp=$("#fZip");
  if (zp){
    zp.oninput = () => { S.zip = zp.value; if (normZip(zp.value).length === 7) fillAddress(); };
    $("#zipBtn").onclick = fillAddress;
    for (const k of ["addr1","addr2"]){
      const el = $(k === "addr1" ? "#fAddr1" : "#fAddr2");
      el.oninput = () => { S[k] = el.value; if (S.tried) el.closest(".field").classList.toggle("bad", !valid()[k]); };
    }
  }
  document.querySelectorAll('input[name="first"]').forEach(r => r.onchange = () => {
    S.first = r.value;
    const pos = window.scrollY; render(); window.scrollTo({top:pos});
    document.querySelector(`input[name="first"][value="${r.value}"]`)?.focus();
  });
  const pf=$("#fPref"); if(pf) pf.onchange = () => { S.pref = pf.value; pf.classList.toggle("empty", !pf.value); renderSummary(); $("#sideNext").onclick = next; };
  const ag=$("#fAgree"); if(ag) ag.onchange = () => { S.agree=ag.checked; };
  const sn=$("#sideNext"); if(sn) sn.onclick = next;
  const cp=$("#copy"); if(cp) cp.onclick = async () => {
    try { await navigator.clipboard.writeText(orderText()); toast("コピーしました"); }
    catch { const r=document.createRange(); r.selectNodeContents($("#txt")); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast("文字を長押ししてコピーしてください"); }
  };
  const rs=$("#restart"); if(rs) rs.onclick = () => {
    Object.keys(S.qty).forEach(k=>S.qty[k]=0);
    Object.assign(S,{step:1,date:null,slot:null,note:"",first:"",name:"",phone:"",line:"",email:"",pref:"",agree:false,tried:false,zip:"",addr1:"",addr2:""});
    render(); window.scrollTo({top:0});
  };
}
$("#barNext").onclick = next;

render();
</script>
